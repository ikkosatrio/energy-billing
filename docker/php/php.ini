; Universal PHP Configuration (Dev & Production)
[PHP]
variables_order = "EGPCS"
expose_php = Off
error_reporting = E_ALL
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
default_charset = "UTF-8"
date.timezone = "UTC"

; Memory and limits (higher for dev, adjusted by environment)
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
post_max_size = 20M
upload_max_filesize = 20M

; Extensions (most are built-in to the base image; xml is compiled-in core)
; extension=mbstring
; extension=bcmath
; extension=gd
; extension=intl
; extension=json
; extension=curl

; Debugging - XDebug (disabled - can be installed if needed for development)
; zend_extension = xdebug.so
; xdebug.mode = off
; xdebug.start_with_request = no
; xdebug.log_level = 0

; OPCache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1

; Session
session.gc_maxlifetime = 10800
session.gc_probability = 1
session.gc_divisor = 100

; IniScan compatibility
realpath_cache_size = 4096K
realpath_cache_ttl = 3600

; Security
; disable_functions=exec,passthru,shell_exec,system,popen

